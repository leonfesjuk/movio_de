services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: movio-app-lh
    restart: unless-stopped
    env_file: .env
    environment:
      # При необходимости переопределите под ваши переменные приложения
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    build:
      context: docker_postgresql/postgres
    container_name: movio-postgres-lh
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres_test:
    build:
      context: docker_postgresql/postgres
    container_name: movio-postgres-test-lh
    restart: always
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME_TEST}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT_TEST}:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME_TEST}"]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - test

volumes:
  pgdata:
    name: movio_pgdata

  pgdata_test:
    name: movio_pgdata_test
